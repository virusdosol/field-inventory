.b.pr{background:var(--gd);border-color:var(--g)}.b.dg{border-color:var(--r);color:#f0a091}

.it{position:absolute;background:#232a20;border:2px solid;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;z-index:2}

<script>
const VER='2026-11-05-b',K='fieldinv.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);

 return{v:1,eq:[E('FORK-01','Alforge artesanal esquerdo',['Principal']),E('FORK-02','Alforge artesanal direito',['Principal']),E('HANDLEBAR-01','Bolsa de guidão',['Principal','Lateral esquerdo','Lateral direito']),E('FRAME-01','Bolsa de quadro',['Principal']),E('BACKPACK-01','Mochila Trilhas & Rumos Crampton 44',['Principal','Superior secundário'],{l:44,b:'Trilhas & Rumos',ext:1}),E('REAR-01','Alforge Elops esquerdo',['Principal'],{l:15}),E('REAR-02','Alforge Elops direito',['Principal'],{l:15})],items:[],cats,lib:[]}}
let S,loadErr='';try{const raw=localStorage.getItem(K);if(raw){try{S=JSON.parse(raw)}catch(e){S=null}if(!S||!Array.isArray(S.eq)||!Array.isArray(S.items)){try{localStorage.setItem(K+'.corrupt',raw)}catch(e2){}loadErr='Os dados salvos estavam ilegíveis. Uma cópia foi guardada e o app abriu vazio. Importe um backup para restaurar.';S=null}}}catch(e){loadErr='Não foi possível ler o armazenamento do navegador. As alterações podem não ser salvas.'}if(!S)S=seed();
const ui={tab:'inv',eq:null,comp:null,sel:null,fc:'',fe:'',sort:'name'};
let toastT;function toast(m,ms,ok){const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--gd)':'';t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms||3500)}
let saveFail=false;
function save(){try{localStorage.setItem(K,JSON.stringify(S));if(saveFail){saveFail=false;render()}markDirty();return true}catch(e){if(!saveFail){saveFail=true;render()}toast('NÃO SALVO: armazenamento cheio ou indisponível. Exporte um backup agora e remova imagens grandes.',9000);return false}}
const E=id=>S.eq.find(e=>e.id===id),It=id=>S.items.find(i=>i.id===id),Ct=id=>S.cats.find(c=>c.id===id);
const isB=cid=>typeof cid==='string'&&cid.startsWith('b:');
const comp=(eid,cid)=>{if(isB(cid)){const b=It(cid.slice(2));return b&&b.box&&b.loc.eq===eid?{id:cid,name:b.name,w:b.box.w,h:b.box.h}:undefined}return E(eid)?.comps.find(c=>c.id===cid)||E(eid)?.extGrids?.find(c=>c.id===cid)};
const kids=b=>S.items.filter(k=>k.loc.comp==='b:'+b.id);
function inside(id,cid){let n=0;while(isB(cid)&&n++<50){const bid=cid.slice(2);if(bid===id)return true;cid=It(bid)?.loc.comp}return false}

const isExtG=(eid,cid)=>!!E(eid)?.extGrids?.some(c=>c.id===cid);
const fixing=new Set();
function fixRot(){S.items.forEach(i=>{if(i.rot!==undefined)return;if(!i.img){i.rot=0;return}if(fixing.has(i.id))return;fixing.add(i.id);const im=new Image();
 im.onload=()=>{const r=im.width/im.height,f=i.w/i.h;i.rot=((r>1.15&&f<.87)||(r<.87&&f>1.15))?90:0;fixing.delete(i.id);save();render()};im.onerror=()=>{i.rot=0;fixing.delete(i.id)};im.src=i.img})}
function migrate(){migrate0();fixRot()}
function migrate0(){if(!Array.isArray(S.lib))S.lib=[];S.eq.forEach(e=>{if(e.ext&&!e.extGrids)e.extGrids=['Tripé','Barraca','Chinelos'].map(n=>({id:uid(),name:n,w:6,h:6}));if(!e.extGrids)e.extGrids=[]});
 S.items.forEach(i=>{if(i.loc.comp!=='ext')return;const e=E(i.loc.eq);if(!e||!e.extGrids.length){e&&(e.extGrids=[{id:uid(),name:'Carga 1',w:6,h:6}])}
  const gs=e.extGrids,pref=gs.find(k=>new RegExp(k.name.slice(0,4),'i').test(i.name));
  for(const g of [pref,...gs].filter(Boolean)){const s=spot(e.id,g.id,i.w,i.h,i.id);if(s){i.w=s.w;i.h=s.h;i.loc={eq:e.id,comp:g.id,x:s.x,y:s.y};return}}
  const g=pref||gs[0];while(true){g.h++;const s=spot(e.id,g.id,i.w,i.h,i.id);if(s){i.w=s.w;i.h=s.h;i.loc={eq:e.id,comp:g.id,x:s.x,y:s.y};return}}})}
const fmtW=g=>g>=1000?(g/1000).toFixed(2).replace('.',',')+' kg':Math.round(g)+' g';
const iw=i=>(+i.g||0)*(+i.qty||1);
const inComp=(eid,cid)=>S.items.filter(i=>i.loc.eq===eid&&i.loc.comp===cid);

function why(eid,cid,x,y,w,h,ign){const c=comp(eid,cid);if(!c)return'Compartimento inexistente.';if(ign&&inside(ign,cid))return'Um recipiente não pode ficar dentro de si mesmo.';
 if(x<0||y<0||x+w>c.w||y+h>c.h)return'Fora da grade ('+c.w+'×'+c.h+').';
 const o=inComp(eid,cid).find(i=>i.id!==ign&&x<i.loc.x+i.w&&x+w>i.loc.x&&y<i.loc.y+i.h&&y+h>i.loc.y);
 return o?'Sobrepõe "'+o.name+'".':''}

 it.w=w;it.h=h;it.loc={eq:eid,comp:cid,x,y};moveKids(it,eid);save();return true}

/* ---------- integridade, troca e biblioteca ---------- */
function cleanData(d){
 if(!d||typeof d!=='object')throw'Arquivo não é um backup válido.';
 for(const k of['eq','items','cats'])if(!Array.isArray(d[k]))throw'Faltam dados: "'+k+'".';
 const ids=new Set(),chk=(o,w)=>{if(!o||typeof o!=='object'||typeof o.id!=='string'||!o.id)throw w+' sem identificador.';if(ids.has(o.id))throw'Identificador repetido em '+w+'.';ids.add(o.id)};
 const num=(v,w)=>{if(!Number.isFinite(+v)||+v<1)throw w+' com tamanho inválido.'};
 d.cats.forEach(c=>{chk(c,'categoria');if(typeof c.name!=='string')throw'Categoria sem nome.'});
 d.eq.forEach(e=>{chk(e,'equipamento');if(!Array.isArray(e.comps))throw'Equipamento sem compartimentos.';[...e.comps,...(e.extGrids||[])].forEach(c=>{chk(c,'compartimento');num(c.w,'Compartimento');num(c.h,'Compartimento')})});
 d.items.forEach(i=>{chk(i,'objeto');if(typeof i.name!=='string')throw'Objeto sem nome.';num(i.w,'"'+i.name+'"');num(i.h,'"'+i.name+'"');if(!i.loc||typeof i.loc!=='object'||!i.loc.eq||!i.loc.comp)throw'"'+i.name+'" sem localização.';i.qty=Math.max(1,Math.floor(+i.qty)||1);i.g=Math.max(0,+i.g||0);if(i.img!=null&&!/^data:image\//.test(i.img))throw'Imagem inválida em "'+i.name+'".'});
 if(d.lib!=null&&!Array.isArray(d.lib))throw'Biblioteca inválida.';d.lib=d.lib||[];d.lib.forEach(l=>{chk(l,'item da biblioteca');if(typeof l.name!=='string')throw'Item da biblioteca sem nome.';num(l.w,'Biblioteca');num(l.h,'Biblioteca')});
 return d}
function importData(d){const old=S;try{S=cleanData(d);migrate0();let m='';for(const i of S.items){m=!comp(i.loc.eq,i.loc.comp)?'não está em um local existente.':why(i.loc.eq,i.loc.comp,i.loc.x,i.loc.y,i.w,i.h,i.id);if(m){m='"'+i.name+'" '+m;break}}if(m)throw m;localStorage.setItem(K,JSON.stringify(S))}
 catch(e){S=old;throw typeof e==='string'?e:'não foi possível gravar (armazenamento cheio ou arquivo corrompido). Nada foi alterado.'}fixRot();markDirty()}
function swapPlan(a,eid,cid,x,y){
 const hit=(i,X,Y,W,H)=>X<i.loc.x+i.w&&X+W>i.loc.x&&Y<i.loc.y+i.h&&Y+H>i.loc.y;
 const bs=inComp(eid,cid).filter(i=>i.id!==a.id&&hit(i,x,y,a.w,a.h));
 if(!bs.length)return null;if(bs.length>1)return{err:'Sobrepõe '+bs.length+' objetos; a troca só funciona com um.'};
 const b=bs[0],s=a.loc,tc=comp(eid,cid),sc=comp(s.eq,s.comp);
 if(!tc||!sc)return{err:'Compartimento inexistente.'};
 if(isB(cid)&&(cid==='b:'+a.id||inside(a.id,cid)))return{err:'Um recipiente não pode ficar dentro de si mesmo.'};
 if(isB(s.comp)&&(s.comp==='b:'+b.id||inside(b.id,s.comp)))return{err:'Um recipiente não pode ficar dentro de si mesmo.'};
 if(x<0||y<0||x+a.w>tc.w||y+a.h>tc.h)return{err:'"'+a.name+'" ficaria fora da grade.'};
 for(const[w,h,r]of[[b.w,b.h,0],[b.h,b.w,90]]){
  if(s.x+w>sc.w||s.y+h>sc.h)continue;
  if(inComp(s.eq,s.comp).some(i=>i.id!==a.id&&i.id!==b.id&&hit(i,s.x,s.y,w,h)))continue;
  if(s.eq===eid&&s.comp===cid&&x<s.x+w&&x+a.w>s.x&&y<s.y+h&&y+a.h>s.y)continue;
  return{b,x,y,bx:s.x,by:s.y,bw:w,bh:h,br:r}}

function doSwap(a,p){const b=p.b,tl=b.loc,ol=a.loc,al={eq:tl.eq,comp:tl.comp,x:p.x,y:p.y},bl={eq:ol.eq,comp:ol.comp,x:p.bx,y:p.by};
 a.loc=al;b.loc=bl;b.w=p.bw;b.h=p.bh;if(p.br)b.rot=((b.rot||0)+90)%360;moveKids(a,al.eq);moveKids(b,bl.eq);save()}

const destOpts=cur=>{const o=(q,k,p)=>`<option value="${q.id}|${k.id}" ${cur===q.id+'|'+k.id?'selected':''}>${esc(q.name)} · ${p}${esc(k.name)}</option>`;return S.eq.map(q=>q.comps.map(k=>o(q,k,'')).join('')+(q.extGrids||[]).map(k=>o(q,k,'Carga externa: ')).join('')).join('')};

const SB='https://xmcmjpqohcozghpzelju.supabase.co',SK='sb_publishable_97rCenViglqzHo5lVHvbOg_ZyInTXgB',MK='fieldinv.sync.v1',BK='item-images';
let M={session:null,base:0,dirty:false,last:null,email:'',up:[]};try{M={...M,...JSON.parse(localStorage.getItem(MK)||'{}')}}catch(e){}
let syS=M.session?(M.dirty?'pend':'ok'):'off',syMsg='',syBusy=false,syT=null,applying=false,chg=0,syConf=null;

const syPill=()=>syS==='off'?'':`<div id="sypill" class="mu" style="text-align:right;margin-bottom:4px" data-a="syOpen">${syTxt()}</div>`;
function paintSy(){const p=$('#sypill'),c=$('#systat');if(p)p.textContent=syTxt();if(c)c.textContent=syStat()}
function setSy(s,m){const was=syS;syS=s;syMsg=m||'';if((was==='off')!==(s==='off'))render();else paintSy()}
function markDirty(){if(applying)return;chg++;if(!M.session)return;M.dirty=true;saveM();if(syS!=='conflict'&&syS!=='auth')setSy('pend');syQ()}
function syQ(ms){clearTimeout(syT);syT=setTimeout(()=>sync(),ms||2500)}
async function sbf(path,o={},tok){const h={apikey:SK,...(tok?{Authorization:'Bearer '+tok}:{}),...(o.json?{'Content-Type':'application/json'}:{}),...(o.headers||{})};return fetch(SB+path,{method:o.method||'GET',headers:h,body:o.json?JSON.stringify(o.json):o.body})}
const errTxt=async r=>{try{const j=await r.json();return j.message||j.msg||j.error_description||j.error||'Erro '+r.status}catch(e){return'Erro '+r.status}};
function setSess(j){M.session={access:j.access_token,refresh:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user.id,email:j.user.email};M.email=j.user.email;saveM()}
async function syAuth(kind,email,pw){const r=await sbf(kind==='login'?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{method:'POST',json:{email,password:pw}});
 if(!r.ok)throw new Error(await errTxt(r));const j=await r.json();if(!j.access_token)return null;setSess(j);return j}
async function tok(){const s=M.session;if(!s)throw new Error('auth');if(s.exp-60>Date.now()/1000)return s.access;
 const r=await sbf('/auth/v1/token?grant_type=refresh_token',{method:'POST',json:{refresh_token:s.refresh}});
 if(r.status>=400&&r.status<500){M.session=null;saveM();throw new Error('auth')}if(!r.ok)throw new TypeError('rede');setSess(await r.json());return M.session.access}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const blobUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function payload(t){const d=JSON.parse(JSON.stringify(S)),up=new Set(M.up||[]);let miss=0;
 for(const i of[...d.items,...d.lib]){if(!i.img)continue;const h=await sha(i.img),p=M.session.uid+'/'+h;
  if(!up.has(h)){try{const b=await(await fetch(i.img)).blob(),r=await sbf('/storage/v1/object/'+BK+'/'+p,{method:'POST',body:b,headers:{'Content-Type':b.type||'image/jpeg','x-upsert':'false'}},t);
   if(r.ok||r.status===409||(r.status===400&&/exists|Duplicate/i.test(await r.text())))up.add(h);else miss++}catch(e){if(e instanceof TypeError)throw e;miss++}}
  delete i.img;if(up.has(h))i.imgRef=h}
 M.up=[...up];return{d,miss}}
async function syPush(t){const c0=chg,{d,miss}=await payload(t),u=M.session.uid;let r;
 if(M.base===0)r=await sbf('/rest/v1/inventories?on_conflict=user_id&select=version',{method:'POST',json:{user_id:u,data:d,version:1},headers:{Prefer:'resolution=ignore-duplicates,return=representation'}},t);
 else r=await sbf('/rest/v1/inventories?select=version&user_id=eq.'+u+'&version=eq.'+M.base,{method:'PATCH',json:{data:d,version:M.base+1},headers:{Prefer:'return=representation'}},t);
 if(!r.ok)throw new Error(await errTxt(r));const rows=await r.json();if(!rows.length)return'conflict';
 M.base=rows[0].version;M.last=new Date().toISOString();if(chg===c0)M.dirty=false;saveM();return miss?'miss':'ok'}
async function syPull(t,row){const have={};for(const i of[...S.items,...S.lib])if(i.img)have[await sha(i.img)]=i.img;
 try{localStorage.setItem('fieldinv.v1.prepull',JSON.stringify(S))}catch(e){}
 applying=true;try{importData(row.data);const need=[];for(const i of[...S.items,...S.lib])if(i.imgRef){if(have[i.imgRef]){i.img=have[i.imgRef];delete i.imgRef}else need.push(i)}
  save();M.base=row.version;M.dirty=false;M.last=new Date().toISOString();saveM();ui.eq=null;ui.sel=null;render();
  for(const i of need){try{const r=await sbf('/storage/v1/object/authenticated/'+BK+'/'+M.session.uid+'/'+i.imgRef,{},t);if(r.ok){i.img=await blobUrl(await r.blob());delete i.imgRef}}catch(e){}}
  if(need.length){save();render()}}finally{applying=false}}
const syErr=e=>e instanceof TypeError?setSy('offline'):e.message==='auth'?setSy('auth'):setSy('err',e.message);
async function sync(manual){if(!M.session||syBusy||(syConf&&!manual))return;syBusy=true;setSy('syncing');
 try{const t=await tok(),u=M.session.uid,r=await sbf('/rest/v1/inventories?select=version,updated_at&user_id=eq.'+u,{},t);if(!r.ok)throw new Error(await errTxt(r));
  const rows=await r.json(),rv=rows.length?rows[0].version:0;let res='ok';
  if(rv===0){M.base=0;
   if(!manual){setSy('pend','Toque em Sincronizar agora para o primeiro envio.');return}
   try{cleanData(JSON.parse(JSON.stringify(S)))}catch(e){throw new Error('Dados locais inválidos: '+e)}
   if(!confirm('A nuvem está vazia. Enviar os dados deste aparelho ('+S.items.length+' objetos) para a nuvem?')){setSy('pend','Envio cancelado.');return}
   res=await syPush(t)}
  else if(rv===M.base){if(M.dirty)res=await syPush(t)}
  else if(!M.dirty&&rv>M.base){const q=await sbf('/rest/v1/inventories?select=version,data&user_id=eq.'+u,{},t);if(!q.ok)throw new Error(await errTxt(q));await syPull(t,(await q.json())[0])}
  else{syConflict(rv);return}
  if(res==='conflict'){syConflict(rv);return}
  syConf=null;setSy('ok',res==='miss'?'Algumas imagens não foram enviadas.':'');if(M.dirty)syQ()}
 catch(e){syErr(e)}finally{syBusy=false;paintSy()}}
function syConflict(rv){syConf=rv;setSy('conflict');modal(`<h2>CONFLITO DE VERSÕES</h2><p class="mu" style="margin:8px 0">A nuvem tem dados e este aparelho também tem alterações. Nada foi sobrescrito. Escolha qual versão manter:</p><button class="b pr" style="width:100%;margin-bottom:8px" data-a="syCloud">Usar a nuvem (guarda cópia local de segurança)</button><button class="b" style="width:100%;margin-bottom:8px" data-a="syLocal">Usar este aparelho (a versão da nuvem fica no histórico)</button><button class="b" style="width:100%" data-a="mc">Decidir depois</button>`)}
async function syRes(w){if(syBusy)return;syBusy=true;setSy('syncing');
 try{const t=await tok(),r=await sbf('/rest/v1/inventories?select=version,data&user_id=eq.'+M.session.uid,{},t);if(!r.ok)throw new Error(await errTxt(r));const row=(await r.json())[0];if(!row)throw new Error('A nuvem está vazia.');
  if(w==='cloud')await syPull(t,row);else{M.base=row.version;if(await syPush(t)==='conflict')throw new Error('A nuvem mudou de novo. Tente outra vez.')}
  syConf=null;setSy('ok')}catch(e){syErr(e)}finally{syBusy=false;paintSy()}}
function syCfg(){if(!M.session)return`<div class="pn"><div class="mu" style="margin-bottom:8px">Entre para guardar seus dados na nuvem e usar em outros aparelhos. O app continua funcionando offline.</div><label>E-mail</label><input id="sy_e" type="email" autocomplete="username" value="${esc(M.email||'')}"><label>Senha (mín. 6)</label><input id="sy_p" type="password" autocomplete="current-password"><div class="grp" style="margin-top:8px"><button class="b pr" data-a="syLogin">Entrar</button><button class="b" data-a="sySignup">Criar conta</button></div></div>`;
 return`<div class="pn"><div><b>${esc(M.session.email)}</b></div><div class="mu" id="systat">${syStat()}</div><div class="grp" style="margin-top:8px"><button class="b pr" data-a="sySync">Sincronizar agora</button><button class="b" data-a="syOut">Sair</button></div></div>`}

/* ---------- views ---------- */
function vInv(){if(ui.eq)return vComp();
 const tw=S.items.reduce((a,i)=>a+iw(i),0);
 return`<div class="row" style="margin-bottom:8px"><h1 class="sp">INVENTÁRIO</h1><span class="cd">${fmtW(tw)}</span></div>`+S.eq.map(e=>{
 let cells=0,used=0;e.comps.forEach(c=>{cells+=c.w*c.h;inComp(e.id,c.id).forEach(i=>used+=i.w*i.h)});
 const its=inEq(e.id),w=its.reduce((a,i)=>a+iw(i),0);
 return`<div class="pn" data-a="openEq" data-id="${e.id}"><div class="row"><div class="sp"><div class="mu">${esc(e.code)}</div><h3>${esc(e.name)}</h3></div><div class="cd">${fmtW(w)}</div></div>
 <div class="mu">${e.comps.length} compartimento(s)${e.liters?' · '+e.liters+' L':''}${e.extGrids?.length?' · carga externa: '+its.filter(i=>isExtG(e.id,i.loc.comp)).length:''} · ${its.length} obj.</div><div class="bar"><i style="width:${pct(used,cells)}%"></i></div><div class="mu">${used}/${cells} células · ${pct(used,cells)}%</div></div>`}).join('')}
const spr=(i,s)=>{if(!i.img)return`<span class="ph">${esc(i.name)}</span>`;const r=(((i.rot||0)%360)+360)%360;if(!r)return`<img src="${i.img}" alt="">`;const W=i.w*s-4,H=i.h*s-4,q=r%180!==0;return`<img src="${i.img}" alt="" style="position:absolute;left:50%;top:50%;width:${q?H:W}px;height:${q?W:H}px;max-width:none;transform:translate(-50%,-50%) rotate(${r}deg)">`};
function gridHtml(e,c){const its=inComp(e.id,c.id);let u=0;its.forEach(i=>u+=i.w*i.h);const t=c.w*c.h,s=cs(c);
 return`<div class="pn row"><div class="sp mu">${c.w}×${c.h} · ${u}/${t} ocupadas · ${t-u} livres · ${pct(u,t)}%</div><b class="cd">${fmtW(its.reduce((a,i)=>a+iw(i),0))}</b></div>
 <div class="gw"><div class="grid" data-c="${c.id}" data-s="${s}" style="grid-template-columns:repeat(${c.w},${s}px);grid-auto-rows:${s}px;width:${c.w*s+2}px">`+
 Array.from({length:c.w*c.h},(_,n)=>`<div class="cell" data-a="cell" data-c="${c.id}" data-x="${n%c.w}" data-y="${n/c.w|0}"></div>`).join('')+
 its.map(i=>{const cc=Ct(i.cat)?.color||'#869080';return`<div class="it ${i.box?'bx':''} ${ui.sel===i.id?'sel':''} ${ui.hl===i.id?'hl':''}" data-id="${i.id}" style="left:${i.loc.x*s}px;top:${i.loc.y*s}px;width:${i.w*s}px;height:${i.h*s}px;border-color:${cc}">${spr(i,s)}${i.qty>1?`<span class="q">${i.qty}</span>`:''}${i.box?`<span class="q" style="left:1px;right:auto">▣${kids(i).length}</span>`:''}</div>`}).join('')+`</div></div>`}
function selPanel(){const i=ui.sel&&It(ui.sel);if(!i)return'';return`<div class="pn"><div class="row">${thumb(i)}<div class="sp"><h3>${esc(i.name)}</h3><div class="mu">${i.w}×${i.h} · qtd ${i.qty} · ${fmtW(iw(i))}</div></div></div>
 <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="b" data-a="rot">Girar 90°</button><button class="b" data-a="qm">−</button><button class="b" data-a="qp">+</button><button class="b" data-a="edit">Editar</button><button class="b" data-a="dup">Duplicar</button><button class="b" data-a="toLib">Salvar na biblioteca</button>${i.box?`<button class="b pr" data-a="openBox" data-id="${i.id}">Abrir</button>`:''}${i.img?`<button class="b" data-a="zoom">Ampliar</button>`:''}<button class="b dg" data-a="del">Excluir</button></div>
 <label>Mover para…</label><select data-a="mvsel"><option value="">Selecione</option>${S.eq.map(q=>q.comps.map(k=>`<option value="${q.id}|${k.id}">${esc(q.name)} · ${esc(k.name)}</option>`).join('')+(q.extGrids||[]).map(k=>`<option value="${q.id}|${k.id}">${esc(q.name)} · Carga externa: ${esc(k.name)}</option>`).join('')).join('')+S.items.filter(b=>b.box&&b.id!==i.id).map(b=>`<option value="${b.loc.eq}|b:${b.id}">▣ ${esc(b.name)} — ${esc(placeStr(b.loc.eq,b.loc.comp))}</option>`).join('')}</select></div>`}
function vComp(){const e=E(ui.eq);if(!e){ui.eq=null;return vInv()}
 const eg=e.extGrids||[],hasExt=e.ext||eg.length;let cid=ui.comp;
 if(cid==='ext'&&!hasExt)cid=ui.comp=e.comps[0]?.id;
 if(cid!=='ext'&&!comp(e.id,cid))cid=ui.comp=e.comps[0]?.id;
 const isExt=cid==='ext',isBox=isB(cid),bx=isBox?It(cid.slice(2)):null;
 let h=isBox?`<div class="row" style="margin-bottom:8px"><button class="b" data-a="closeBox">‹ Fechar</button><div class="sp"><h2>▣ ${esc(bx.name)}</h2><div class="mu">${esc(placeStr(bx.loc.eq,bx.loc.comp))}</div></div></div>`:(`<div class="row" style="margin-bottom:8px"><button class="b" data-a="back">‹ Voltar</button><div class="sp"><h2>${esc(e.name)}</h2></div></div><div class="tabs">`+
 e.comps.map(k=>`<button class="b ${k.id===cid?'pr':''}" data-a="tab" data-id="${k.id}">${esc(k.name)}</button>`).join('')+(hasExt?`<button class="b ${isExt?'pr':''}" data-a="tab" data-id="ext">EXTERNAL LOAD</button>`:'')+`</div>`);
 const hint=`<div class="mu" style="margin:6px 0">Toque num objeto para selecionar e numa célula para posicionar, ou arraste.</div>`;
 if(isExt){h+=`<div class="pn mu">Carga presa por fora. Cada grade é independente; edite, crie ou remova em Config.</div>`+selPanel()+hint;
  if(!eg.length)h+=`<div class="pn mu">Nenhuma grade externa. Crie uma em Config.</div>`;
  eg.forEach(g=>{h+=`<h3 style="margin:14px 0 6px;color:var(--g)">${esc(g.name)}</h3>`+gridHtml(e,g)+`<button class="b pr" style="width:100%;margin:8px 0 4px" data-a="newItem" data-id="${g.id}">+ Adicionar objeto em ${esc(g.name)}</button><button class="b" style="width:100%;margin:0 0 8px" data-a="libPick" data-id="${g.id}">+ Da biblioteca</button>`+inComp(e.id,g.id).map(rowItem).join('')})}
 else{const c=comp(e.id,cid);if(!c)return h+`<div class="pn mu">Este equipamento não tem compartimentos. Crie um em Config.</div>`;
  h+=gridHtml(e,c)+hint+`<button class="b pr" style="width:100%;margin:8px 0" data-a="newItem" data-id="${c.id}">+ Adicionar objeto</button><button class="b" style="width:100%;margin:0 0 8px" data-a="libPick" data-id="${c.id}">+ Da biblioteca</button>`+selPanel()+inComp(e.id,cid).map(rowItem).join('')}
 return h}

 <label>Imagem (PNG, WebP ou JPG)</label><input type="file" id="f_i" accept="image/png,image/webp,image/jpeg">${i.img?`<label><input type="checkbox" id="f_ri" style="width:auto;min-height:0"> Remover imagem atual</label>`:''}
 <label>Observações</label><textarea id="f_o">${esc(i.notes)}</textarea><div class="row" style="margin-top:12px"><button class="b sp" data-a="mc">Cancelar</button><button class="b pr sp" data-a="saveItem" data-id="${i.id||''}">Salvar</button></div>${ui.libMode&&i.id?`<button class="b dg" style="width:100%;margin-top:8px" data-a="libDel" data-id="${i.id}">Excluir da biblioteca</button>`:''}`);
 $('#f_i').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,384/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*m);cv.height=Math.round(im.height*m);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pendImg=cv.toDataURL('image/webp',.85);toast('Imagem pronta.')};im.onerror=()=>toast('Imagem inválida.');im.src=r.result};r.readAsDataURL(f)}}
function saveItem(id){const n=$('#f_n').value.trim();if(!n)return toast('Informe o nome.');
 const w=Math.max(1,parseInt($('#f_w').value)||1),h=Math.max(1,parseInt($('#f_h').value)||1),stack=$('#f_st').checked;let qty=Math.max(1,parseInt($('#f_q').value)||1);if(!stack)qty=1;

 else{const i={id:uid(),...d,w,h,rot:0,img:pendImg||null,loc:null};
  {const cid=ui.target||ui.comp;const s=spot(ui.eq,cid,w,h);if(!s)return toast('Sem espaço livre nesta grade para '+w+'×'+h+'.');i.w=s.w;i.h=s.h;i.loc={eq:ui.eq,comp:cid,x:s.x,y:s.y}}

 if(a==='del'&&it&&kids(it).length)return toast('Esvazie "'+it.name+'" antes de excluir.');
 if(a==='del'&&it&&confirm('Excluir "'+it.name+'"?')){S.items=S.items.filter(i=>i.id!==it.id);ui.sel=null;save();render()}
 if(a==='zoom'&&it)modal(`<img src="${it.img}" style="width:100%;max-height:70vh;object-fit:contain;background:#000"><button class="b" style="width:100%;margin-top:8px" data-a="mc">Fechar</button>`);
 /* nuvem */
 if(a==='syLogin'||a==='sySignup'){const e=$('#sy_e').value.trim(),p=$('#sy_p').value;if(!e||p.length<6)return toast('Informe e-mail e senha (mín. 6 caracteres).');toast('Conectando…',2000,true);
  syAuth(a==='syLogin'?'login':'sySignup'===a?'signup':'login',e,p).then(j=>{if(!j)return toast('Conta criada. Confirme o e-mail enviado e depois toque em Entrar.',9000,true);M.base=0;M.dirty=true;M.up=[];saveM();setSy('pend');render();sync(true)}).catch(x=>toast(x instanceof TypeError?'Sem conexão.':String(x.message||x),6000))}
 if(a==='syOut'&&(!M.dirty||confirm('Há alterações ainda não enviadas. Sair mesmo assim? Elas continuam salvas neste aparelho.'))){const t=M.session&&M.session.access;M.session=null;M.base=0;M.dirty=false;M.up=[];saveM();syConf=null;setSy('off');if(t)sbf('/auth/v1/logout',{method:'POST'},t).catch(()=>{});render()}

 if(a==='libUse'){const l=S.lib.find(x=>x.id===id),cur=ui.eq&&ui.comp&&!isB(ui.comp)&&ui.comp!=='ext'?ui.eq+'|'+ui.comp:'';ui.lu=id;modal(`<h2>USAR “${esc(l.name)}”</h2><label>Destino</label><select id="lu_d">${destOpts(cur)}</select><div class="row" style="margin-top:12px"><button class="b sp" data-a="mc">Cancelar</button><button class="b pr sp" data-a="libGo">Adicionar</button></div>`)}
 if(a==='libGo'){const[e,k]=($('#lu_d').value||'|').split('|'),l=S.lib.find(x=>x.id===ui.lu);if(!e||!k)return toast('Escolha o destino.');if(l&&fromLib(l,e,k)){closeM();ui.tab='inv';ui.eq=e;ui.comp=isExtG(e,k)?'ext':k;render()}}
 if(a==='libPick'){ui.pk=id;ui.lpq='';modal(`<h2>DA BIBLIOTECA</h2><input id="lpq" placeholder="Buscar…" style="margin:8px 0"><div id="lpres">${libPickRows()}</div><button class="b" style="width:100%;margin-top:8px" data-a="mc">Fechar</button>`)}
 if(a==='libAdd'){const l=S.lib.find(x=>x.id===id);if(l&&fromLib(l,ui.eq,ui.pk)){closeM();render()}}

 if(a==='cpSave'){const[e,k]=id.split('|'),w=Math.max(1,parseInt(g('w'))||1),h=Math.max(1,parseInt(g('h'))||1);if(!g('n'))return toast('Informe o nome.');
  if(k==='@ext')E(e).extGrids.push({id:uid(),name:g('n'),w,h});else if(k){const bad=inComp(e,k).find(i=>i.loc.x+i.w>w||i.loc.y+i.h>h);if(bad)return toast('"'+bad.name+'" ficaria fora da grade. Mova-o antes.');Object.assign(comp(e,k),{name:g('n'),w,h})}else E(e).comps.push({id:uid(),name:g('n'),w,h});save();closeM();render()}
 if(a==='cpDel'){const[e,k]=id.split('|');if(inComp(e,k).length)return toast('Esvazie o compartimento antes de excluir.');if(confirm('Excluir compartimento?')){E(e).comps=E(e).comps.filter(c=>c.id!==k);if(E(e).extGrids)E(e).extGrids=E(e).extGrids.filter(c=>c.id!==k);save();render()}}
 if(a==='catAdd')simpleForm('NOVA CATEGORIA',[['n','Nome'],['c','Cor','#78a342','type=color'],['d','Descrição']],'catSave');

let dr=null,lastTap={id:null,t:0};

function dropPos(ev){const gr=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.grid');if(!gr)return null;const r=gr.getBoundingClientRect(),s=+gr.dataset.s;return{gr,s,x:Math.round((ev.clientX-dr.ox-r.left)/s),y:Math.round((ev.clientY-dr.oy-r.top)/s)}}
document.addEventListener('pointermove',ev=>{if(!dr)return;const it=It(dr.id);if(!dr.on){if(Math.hypot(ev.clientX-dr.x,ev.clientY-dr.y)<8)return;dr.on=true;document.body.classList.add('dragging');const gh=$('#ghost'),c=comp(it.loc.eq,it.loc.comp),s=cs(c);gh.style.cssText=`display:block;width:${it.w*s}px;height:${it.h*s}px`}
 ev.preventDefault();const gh=$('#ghost');gh.style.left=ev.clientX-dr.ox+'px';gh.style.top=ev.clientY-dr.oy+'px';
 document.querySelectorAll('.prev').forEach(p=>p.remove());const p=dropPos(ev);if(p){const bad=why(ui.eq,p.gr.dataset.c,p.x,p.y,it.w,it.h,it.id),sp=bad?swapPlan(it,ui.eq,p.gr.dataset.c,p.x,p.y):null,col=!bad?'#78a342':sp&&!sp.err?'#d0a63a':'#c9482f',d=document.createElement('div');d.className='prev';d.style.cssText=`left:${p.x*p.s}px;top:${p.y*p.s}px;width:${it.w*p.s}px;height:${it.h*p.s}px;border-color:${col};background:${col}55`;p.gr.appendChild(d)}},{passive:false});
