<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Inventory</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0d0b;--p1:#141713;--p2:#1d211b;--p3:#272c25;--ln:#2f362c;--tx:#d9dfd3;--mu:#869080;--g:#78a342;--gd:#3d5622;--r:#c9482f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 Barlow,system-ui,sans-serif}
h1,h2,h3,.cd{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
main{padding:10px 12px 84px;max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--p1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:54px;background:none;border:0;color:var(--mu);font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.04em}
nav button.on{color:var(--g);box-shadow:inset 0 2px 0 var(--g)}
.pn{touch-action:manipulation;background:var(--p1);border:1px solid var(--ln);padding:10px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{background:var(--p3);border:1px solid var(--ln);min-height:40px;padding:0 12px;border-radius:2px}
.b.pr{background:var(--gd);border-color:var(--g)}.b.dg{border-color:var(--r);color:#f0a091}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:2px;padding:8px;width:100%;min-height:40px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
.bar{height:5px;background:var(--p3);margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px}.tabs button{white-space:nowrap}
.gw{overflow-x:auto;padding:2px}
.grid{position:relative;display:grid;border:1px solid var(--g);background:var(--bg);touch-action:pan-x pan-y}
.cell{border:1px solid #20251e;background:#10130f}
.it{position:absolute;background:#232a20;border:2px solid;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;z-index:2}
.it img{width:100%;height:100%;object-fit:contain;padding:2px;pointer-events:none}
.it .ph{font-size:10px;color:var(--mu);text-align:center;padding:2px;pointer-events:none;line-height:1}
.it .q{position:absolute;right:1px;bottom:0;font-size:11px;background:#000a;padding:0 3px;pointer-events:none}
.it.bx{border-style:dashed}.it.sel{outline:2px solid #fff;z-index:4}.it.hl{animation:pl 1s 3}
@keyframes pl{50%{background:var(--gd)}}
.prev{position:absolute;z-index:3;pointer-events:none;border:2px solid;opacity:.55}
.dragging .it{pointer-events:none}.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.8;border:2px solid #fff;background:#232a20}
.dragging .ghost{display:block}
.th{width:42px;height:42px;background:var(--bg);border:1px solid var(--ln);flex:none}.th img{width:100%;height:100%;object-fit:contain}
.chip{display:inline-block;padding:0 6px;font-size:12px;border-left:3px solid;background:var(--p3)}
.ban{position:sticky;top:0;z-index:6;background:var(--gd);border:1px solid var(--g);padding:8px;margin-bottom:8px}
#modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;overflow:auto;padding:12px}
#modal>div{max-width:520px;margin:0 auto;background:var(--p1);border:1px solid var(--g);padding:12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--r);padding:10px;z-index:30;display:none;max-width:540px;margin:auto}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div><div id="modal"></div><div class="ghost" id="ghost" style="display:none"></div>
<script>
const K='fieldinv.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){const C=(n)=>({id:uid(),name:n,w:6,h:6});
 const E=(code,name,comps,x={})=>({id:uid(),code,name,liters:x.l||'',brand:x.b||'',ext:!!x.ext,comps:comps.map(C)});
 const cats=[['Camping','#6f9a3f'],['Cozinha','#d08b30'],['Fotografia','#7a8fd0'],['Eletrônicos','#3fa6b5'],['Ferramentas','#b0b0a0'],['Vestuário','#a272b8'],['Higiene pessoal','#5fb58a'],['Documentos','#d0c05a'],['Manutenção de bicicleta','#c9482f'],['Alimentação','#8bbf4a'],['Segurança','#e0653f'],['Outros','#869080']].map(([name,color])=>({id:uid(),name,color,icon:name[0],desc:'',subs:[]}));
 return{v:1,eq:[E('FORK-01','Alforge artesanal esquerdo',['Principal']),E('FORK-02','Alforge artesanal direito',['Principal']),E('HANDLEBAR-01','Bolsa de guidão',['Principal','Lateral esquerdo','Lateral direito']),E('FRAME-01','Bolsa de quadro',['Principal']),E('BACKPACK-01','Mochila Trilhas & Rumos Crampton 44',['Principal','Superior secundário'],{l:44,b:'Trilhas & Rumos',ext:1}),E('REAR-01','Alforge Elops esquerdo',['Principal'],{l:15}),E('REAR-02','Alforge Elops direito',['Principal'],{l:15})],items:[],cats}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.eq)S=seed();
const ui={tab:'inv',eq:null,comp:null,sel:null,fc:'',fe:'',sort:'name'};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3500)}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Armazenamento cheio: exporte um backup e remova imagens grandes.')}}
const E=id=>S.eq.find(e=>e.id===id),It=id=>S.items.find(i=>i.id===id),Ct=id=>S.cats.find(c=>c.id===id);
const isB=cid=>typeof cid==='string'&&cid.startsWith('b:');
const comp=(eid,cid)=>{if(isB(cid)){const b=It(cid.slice(2));return b&&b.box&&b.loc.eq===eid?{id:cid,name:b.name,w:b.box.w,h:b.box.h}:undefined}return E(eid)?.comps.find(c=>c.id===cid)||E(eid)?.extGrids?.find(c=>c.id===cid)};
const kids=b=>S.items.filter(k=>k.loc.comp==='b:'+b.id);
function inside(id,cid){let n=0;while(isB(cid)&&n++<50){const bid=cid.slice(2);if(bid===id)return true;cid=It(bid)?.loc.comp}return false}
function moveKids(b,eid){kids(b).forEach(k=>{k.loc.eq=eid;moveKids(k,eid)})}
function placeStr(eid,cid){if(isB(cid)){const b=It(cid.slice(2));return b?placeStr(b.loc.eq,b.loc.comp)+' › '+b.name:'?'}const e=E(eid);return e?e.name+' · '+(isExtG(eid,cid)?'Carga externa: ':'')+(comp(eid,cid)?.name||'?'):'—'}
const isExtG=(eid,cid)=>!!E(eid)?.extGrids?.some(c=>c.id===cid);
const fixing=new Set();
function fixRot(){S.items.forEach(i=>{if(i.rot!==undefined)return;if(!i.img){i.rot=0;return}if(fixing.has(i.id))return;fixing.add(i.id);const im=new Image();
 im.onload=()=>{const r=im.width/im.height,f=i.w/i.h;i.rot=((r>1.15&&f<.87)||(r<.87&&f>1.15))?90:0;fixing.delete(i.id);save();render()};im.onerror=()=>{i.rot=0;fixing.delete(i.id)};im.src=i.img})}
function migrate(){migrate0();fixRot()}
function migrate0(){S.eq.forEach(e=>{if(e.ext&&!e.extGrids)e.extGrids=['Tripé','Barraca','Chinelos'].map(n=>({id:uid(),name:n,w:6,h:6}));if(!e.extGrids)e.extGrids=[]});
 S.items.forEach(i=>{if(i.loc.comp!=='ext')return;const e=E(i.loc.eq);if(!e||!e.extGrids.length){e&&(e.extGrids=[{id:uid(),name:'Carga 1',w:6,h:6}])}
  const gs=e.extGrids,pref=gs.find(k=>new RegExp(k.name.slice(0,4),'i').test(i.name));
  for(const g of [pref,...gs].filter(Boolean)){const s=spot(e.id,g.id,i.w,i.h,i.id);if(s){i.w=s.w;i.h=s.h;i.loc={eq:e.id,comp:g.id,x:s.x,y:s.y};return}}
  const g=pref||gs[0];while(true){g.h++;const s=spot(e.id,g.id,i.w,i.h,i.id);if(s){i.w=s.w;i.h=s.h;i.loc={eq:e.id,comp:g.id,x:s.x,y:s.y};return}}})}
const fmtW=g=>g>=1000?(g/1000).toFixed(2).replace('.',',')+' kg':Math.round(g)+' g';
const iw=i=>(+i.g||0)*(+i.qty||1);
const inComp=(eid,cid)=>S.items.filter(i=>i.loc.eq===eid&&i.loc.comp===cid);
const inEq=eid=>S.items.filter(i=>i.loc.eq===eid);
const locStr=i=>placeStr(i.loc.eq,i.loc.comp);
function why(eid,cid,x,y,w,h,ign){const c=comp(eid,cid);if(!c)return'Compartimento inexistente.';if(ign&&inside(ign,cid))return'Um recipiente não pode ficar dentro de si mesmo.';
 if(x<0||y<0||x+w>c.w||y+h>c.h)return'Fora da grade ('+c.w+'×'+c.h+').';
 const o=inComp(eid,cid).find(i=>i.id!==ign&&x<i.loc.x+i.w&&x+w>i.loc.x&&y<i.loc.y+i.h&&y+h>i.loc.y);
 return o?'Sobrepõe "'+o.name+'".':''}
function spot(eid,cid,w,h,ign){const c=comp(eid,cid);for(const[a,b]of[[w,h],[h,w]])for(let y=0;y<=c.h-b;y++)for(let x=0;x<=c.w-a;x++)if(!why(eid,cid,x,y,a,b,ign))return{x,y,w:a,h:b};return null}
function put(it,eid,cid,x,y,w,h){const m=why(eid,cid,x,y,w,h,it.id);if(m){toast('Não coube: '+m+' O objeto continua onde estava.');return false}
 it.w=w;it.h=h;it.loc={eq:eid,comp:cid,x,y};moveKids(it,eid);save();return true}
function autoMove(it,eid,cid){const s=spot(eid,cid,it.w,it.h,it.id);if(!s){toast('Sem espaço livre em '+comp(eid,cid).name+'. O objeto continua onde estava.');return false}return put(it,eid,cid,s.x,s.y,s.w,s.h)}
function cs(c){const av=Math.min(innerWidth,560)-40;return Math.max(24,Math.min(56,Math.floor(av/c.w)))}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const catChip=i=>{const c=Ct(i.cat);return c?`<span class="chip" style="border-color:${c.color}">${esc(c.name)}${i.sub?' / '+esc(i.sub):''}</span>`:''};
const thumb=i=>`<div class="th">${i.img?`<img src="${i.img}" alt="">`:''}</div>`;

/* ---------- views ---------- */
function vInv(){if(ui.eq)return vComp();
 const tw=S.items.reduce((a,i)=>a+iw(i),0);
 return`<div class="row" style="margin-bottom:8px"><h1 class="sp">INVENTÁRIO</h1><span class="cd">${fmtW(tw)}</span></div>`+S.eq.map(e=>{
 let cells=0,used=0;e.comps.forEach(c=>{cells+=c.w*c.h;inComp(e.id,c.id).forEach(i=>used+=i.w*i.h)});
 const its=inEq(e.id),w=its.reduce((a,i)=>a+iw(i),0);
 return`<div class="pn" data-a="openEq" data-id="${e.id}"><div class="row"><div class="sp"><div class="mu">${esc(e.code)}</div><h3>${esc(e.name)}</h3></div><div class="cd">${fmtW(w)}</div></div>
 <div class="mu">${e.comps.length} compartimento(s)${e.liters?' · '+e.liters+' L':''}${e.extGrids?.length?' · carga externa: '+its.filter(i=>isExtG(e.id,i.loc.comp)).length:''} · ${its.length} obj.</div><div class="bar"><i style="width:${pct(used,cells)}%"></i></div><div class="mu">${used}/${cells} células · ${pct(used,cells)}%</div></div>`}).join('')}
const spr=(i,s)=>{if(!i.img)return`<span class="ph">${esc(i.name)}</span>`;const r=(((i.rot||0)%360)+360)%360;if(!r)return`<img src="${i.img}" alt="">`;const W=i.w*s-4,H=i.h*s-4,q=r%180!==0;return`<img src="${i.img}" alt="" style="position:absolute;left:50%;top:50%;width:${q?H:W}px;height:${q?W:H}px;max-width:none;transform:translate(-50%,-50%) rotate(${r}deg)">`};
function gridHtml(e,c){const its=inComp(e.id,c.id);let u=0;its.forEach(i=>u+=i.w*i.h);const t=c.w*c.h,s=cs(c);
 return`<div class="pn row"><div class="sp mu">${c.w}×${c.h} · ${u}/${t} ocupadas · ${t-u} livres · ${pct(u,t)}%</div><b class="cd">${fmtW(its.reduce((a,i)=>a+iw(i),0))}</b></div>
 <div class="gw"><div class="grid" data-c="${c.id}" data-s="${s}" style="grid-template-columns:repeat(${c.w},${s}px);grid-auto-rows:${s}px;width:${c.w*s+2}px">`+
 Array.from({length:c.w*c.h},(_,n)=>`<div class="cell" data-a="cell" data-c="${c.id}" data-x="${n%c.w}" data-y="${n/c.w|0}"></div>`).join('')+
 its.map(i=>{const cc=Ct(i.cat)?.color||'#869080';return`<div class="it ${i.box?'bx':''} ${ui.sel===i.id?'sel':''} ${ui.hl===i.id?'hl':''}" data-id="${i.id}" style="left:${i.loc.x*s}px;top:${i.loc.y*s}px;width:${i.w*s}px;height:${i.h*s}px;border-color:${cc}">${spr(i,s)}${i.qty>1?`<span class="q">${i.qty}</span>`:''}${i.box?`<span class="q" style="left:1px;right:auto">▣${kids(i).length}</span>`:''}</div>`}).join('')+`</div></div>`}
function selPanel(){const i=ui.sel&&It(ui.sel);if(!i)return'';return`<div class="pn"><div class="row">${thumb(i)}<div class="sp"><h3>${esc(i.name)}</h3><div class="mu">${i.w}×${i.h} · qtd ${i.qty} · ${fmtW(iw(i))}</div></div></div>
 <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="b" data-a="rot">Girar 90°</button><button class="b" data-a="qm">−</button><button class="b" data-a="qp">+</button><button class="b" data-a="edit">Editar</button><button class="b" data-a="dup">Duplicar</button>${i.box?`<button class="b pr" data-a="openBox" data-id="${i.id}">Abrir</button>`:''}${i.img?`<button class="b" data-a="zoom">Ampliar</button>`:''}<button class="b dg" data-a="del">Excluir</button></div>
 <label>Mover para…</label><select data-a="mvsel"><option value="">Selecione</option>${S.eq.map(q=>q.comps.map(k=>`<option value="${q.id}|${k.id}">${esc(q.name)} · ${esc(k.name)}</option>`).join('')+(q.extGrids||[]).map(k=>`<option value="${q.id}|${k.id}">${esc(q.name)} · Carga externa: ${esc(k.name)}</option>`).join('')).join('')+S.items.filter(b=>b.box&&b.id!==i.id).map(b=>`<option value="${b.loc.eq}|b:${b.id}">▣ ${esc(b.name)} — ${esc(placeStr(b.loc.eq,b.loc.comp))}</option>`).join('')}</select></div>`}
function vComp(){const e=E(ui.eq);if(!e){ui.eq=null;return vInv()}
 const eg=e.extGrids||[],hasExt=e.ext||eg.length;let cid=ui.comp;
 if(cid==='ext'&&!hasExt)cid=ui.comp=e.comps[0]?.id;
 if(cid!=='ext'&&!comp(e.id,cid))cid=ui.comp=e.comps[0]?.id;
 const isExt=cid==='ext',isBox=isB(cid),bx=isBox?It(cid.slice(2)):null;
 let h=isBox?`<div class="row" style="margin-bottom:8px"><button class="b" data-a="closeBox">‹ Fechar</button><div class="sp"><h2>▣ ${esc(bx.name)}</h2><div class="mu">${esc(placeStr(bx.loc.eq,bx.loc.comp))}</div></div></div>`:(`<div class="row" style="margin-bottom:8px"><button class="b" data-a="back">‹ Voltar</button><div class="sp"><h2>${esc(e.name)}</h2></div></div><div class="tabs">`+
 e.comps.map(k=>`<button class="b ${k.id===cid?'pr':''}" data-a="tab" data-id="${k.id}">${esc(k.name)}</button>`).join('')+(hasExt?`<button class="b ${isExt?'pr':''}" data-a="tab" data-id="ext">EXTERNAL LOAD</button>`:'')+`</div>`);
 const hint=`<div class="mu" style="margin:6px 0">Toque num objeto para selecionar e numa célula para posicionar, ou arraste.</div>`;
 if(isExt){h+=`<div class="pn mu">Carga presa por fora. Cada grade é independente; edite, crie ou remova em Config.</div>`+selPanel()+hint;
  if(!eg.length)h+=`<div class="pn mu">Nenhuma grade externa. Crie uma em Config.</div>`;
  eg.forEach(g=>{h+=`<h3 style="margin:14px 0 6px;color:var(--g)">${esc(g.name)}</h3>`+gridHtml(e,g)+`<button class="b pr" style="width:100%;margin:8px 0" data-a="newItem" data-id="${g.id}">+ Adicionar objeto em ${esc(g.name)}</button>`+inComp(e.id,g.id).map(rowItem).join('')})}
 else{const c=comp(e.id,cid);if(!c)return h+`<div class="pn mu">Este equipamento não tem compartimentos. Crie um em Config.</div>`;
  h+=gridHtml(e,c)+hint+`<button class="b pr" style="width:100%;margin:8px 0" data-a="newItem" data-id="${c.id}">+ Adicionar objeto</button>`+selPanel()+inComp(e.id,cid).map(rowItem).join('')}
 return h}
function rowItem(i){const n=i.box?kids(i).length:0;return`<div class="pn row" data-a="pick" data-id="${i.id}">${thumb(i)}<div class="sp"><b>${esc(i.name)}</b> ${catChip(i)}<div class="mu">${i.box?'▣ '+n+' item(ns) dentro · ':''}${i.w}×${i.h} · qtd ${i.qty} · ${fmtW(iw(i))}</div></div>${i.box?`<button class="b pr" data-a="openBox" data-id="${i.id}">Abrir</button>`:''}</div>`}
function listRow(i){return`<div class="pn row" data-a="go" data-id="${i.id}">${thumb(i)}<div class="sp"><b>${esc(i.name)}</b> ${catChip(i)}<div class="mu">${esc(locStr(i))}</div></div><div class="cd">${i.qty}× · ${fmtW(iw(i))}</div></div>`}
function sel(id,lab,opts,v){return`<select id="${id}"><option value="">${lab}</option>${opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}
function vAll(){let l=S.items.filter(i=>(!ui.fc||i.cat===ui.fc)&&(!ui.fe||i.loc.eq===ui.fe));
 l.sort((a,b)=>ui.sort==='w'?iw(b)-iw(a):ui.sort==='q'?b.qty-a.qty:a.name.localeCompare(b.name));
 return`<h1>TODOS OS OBJETOS</h1><div class="grp">${sel('fc','Categoria',S.cats.map(c=>[c.id,c.name]),ui.fc)}${sel('fe','Equipamento',S.eq.map(c=>[c.id,c.name]),ui.fe)}</div><label>Ordenar</label>${sel('so','',[['name','Nome'],['w','Peso'],['q','Quantidade']],ui.sort).replace('<option value=""></option>','')}<div style="margin-top:8px">${l.map(listRow).join('')||'<div class="pn mu">Nenhum objeto. Abra um compartimento e toque em “Adicionar objeto”.</div>'}</div>`}
function vCats(){return`<h1>CATEGORIAS</h1><div class="mu" style="margin:4px 0 8px">Agrupam objetos sem mudar onde eles estão guardados.</div>`+S.cats.map(c=>{const l=S.items.filter(i=>i.cat===c.id);return`<details class="pn" ${ui.fc===c.id?'open':''}><summary><span class="chip" style="border-color:${c.color}">${esc(c.name)}</span> <span class="mu">${l.length} obj. · ${fmtW(l.reduce((a,i)=>a+iw(i),0))}</span></summary>${l.map(listRow).join('')||'<div class="mu">Vazia.</div>'}</details>`}).join('')}
function vFind(){return`<h1>BUSCA</h1><input id="q" placeholder="Nome do objeto…" value="${esc(ui.q||'')}" style="margin:8px 0"><div id="res">${resHtml()}</div>`}
function resHtml(){const q=(ui.q||'').trim().toLowerCase();if(!q)return'<div class="mu">Digite para localizar um objeto.</div>';return S.items.filter(i=>i.name.toLowerCase().includes(q)).map(listRow).join('')||'<div class="mu">Nada encontrado.</div>'}
function vStats(){const tw=S.items.reduce((a,i)=>a+iw(i),0),n=S.items.reduce((a,i)=>a+i.qty,0);let cells=0,used=0;
 const eqs=S.eq.map(e=>{let c=0,u=0;e.comps.forEach(k=>{c+=k.w*k.h;inComp(e.id,k.id).forEach(i=>u+=i.w*i.h)});cells+=c;used+=u;return{e,w:inEq(e.id).reduce((a,i)=>a+iw(i),0),c,u}});
 return`<h1>ESTATÍSTICAS</h1><div class="pn"><div class="cd" style="font-size:26px">${fmtW(tw)}</div><div class="mu">${n} unidades · ${S.items.length} objetos · ${used}/${cells} células · ${cells-used} livres</div></div><h3>Peso por equipamento</h3>`+
 eqs.map(x=>`<div class="pn"><div class="row"><span class="sp">${esc(x.e.name)}</span><b>${fmtW(x.w)}</b></div><div class="bar"><i style="width:${pct(x.u,x.c)}%"></i></div><div class="mu">${pct(x.u,x.c)}% ocupado · ${x.c-x.u} livres</div></div>`).join('')+`<h3>Por categoria</h3>`+
 S.cats.map(c=>{const l=S.items.filter(i=>i.cat===c.id),w=l.reduce((a,i)=>a+iw(i),0);return`<div class="pn"><div class="row"><span class="sp chip" style="border-color:${c.color}">${esc(c.name)}</span><span>${l.length} · ${fmtW(w)}</span></div><div class="bar"><i style="width:${pct(w,tw)}%;background:${c.color}"></i></div></div>`}).join('')}
function extCfg(e){if(!e.ext&&!(e.extGrids||[]).length)return`<button class="b" style="margin:8px 0 0 8px" data-a="extOn" data-id="${e.id}">+ Ativar carga externa</button>`;
 return`<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:8px"><b class="cd" style="color:var(--g)">EXTERNAL LOAD</b>`+(e.extGrids||[]).map(k=>`<div class="row mu" style="margin-top:6px"><span class="sp">${esc(k.name)} — ${k.w}×${k.h} (${k.w*k.h} células)</span><button class="b" data-a="cpEdit" data-id="${e.id}|${k.id}">Grade</button><button class="b dg" data-a="cpDel" data-id="${e.id}|${k.id}">×</button></div>`).join('')+`<button class="b" style="margin-top:8px" data-a="cpAdd" data-id="${e.id}|@ext">+ Grade externa</button></div>`}
function vCfg(){return`<h1>CONFIGURAÇÕES</h1><h3 style="margin-top:10px">Equipamentos</h3>`+S.eq.map(e=>`<div class="pn"><div class="row"><div class="sp"><b>${esc(e.name)}</b><div class="mu">${esc(e.code)}${e.liters?' · '+e.liters+' L':''}</div></div><button class="b" data-a="eqEdit" data-id="${e.id}">Editar</button><button class="b dg" data-a="eqDel" data-id="${e.id}">×</button></div>
 ${e.comps.map(k=>`<div class="row mu" style="margin-top:6px"><span class="sp">${esc(k.name)} — ${k.w}×${k.h} (${k.w*k.h} células)</span><button class="b" data-a="cpEdit" data-id="${e.id}|${k.id}">Grade</button><button class="b dg" data-a="cpDel" data-id="${e.id}|${k.id}">×</button></div>`).join('')}
 <button class="b" style="margin-top:8px" data-a="cpAdd" data-id="${e.id}">+ Compartimento</button>${extCfg(e)}</div>`).join('')+`<button class="b pr" style="width:100%" data-a="eqAdd">+ Novo equipamento</button>
 <h3 style="margin-top:14px">Categorias</h3>`+S.cats.map(c=>`<div class="row pn"><span class="chip sp" style="border-color:${c.color}">${esc(c.name)}</span><button class="b" data-a="catEdit" data-id="${c.id}">Editar</button><button class="b dg" data-a="catDel" data-id="${c.id}">×</button></div>`).join('')+`<button class="b pr" style="width:100%" data-a="catAdd">+ Nova categoria</button>
 <h3 style="margin-top:14px">Backup</h3><div class="grp"><button class="b" data-a="exp">Exportar</button><button class="b" data-a="imp">Importar</button></div><input type="file" id="impf" accept=".json" style="display:none">
 <h3 style="margin-top:14px">Sincronização</h3><div class="pn mu">Nuvem ainda não conectada. Os dados ficam salvos neste aparelho; use o backup para levar a outro dispositivo.</div>`}
const VIEWS={inv:vInv,all:vAll,cats:vCats,find:vFind,stats:vStats,cfg:vCfg};
const TABS=[['inv','Inventário'],['all','Objetos'],['cats','Categorias'],['find','Busca'],['stats','Stats'],['cfg','Config']];
function render(){const sc=scrollY;let h='';if(ui.sel&&It(ui.sel)&&ui.tab==='inv'){h+=`<div class="ban row"><span class="sp">Movendo <b>${esc(It(ui.sel).name)}</b> — toque numa célula.</span><button class="b" data-a="desel">OK</button></div>`}
 $('#app').innerHTML=h+VIEWS[ui.tab]();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===ui.tab?'on':''}" data-a="nav" data-id="${t[0]}">${t[1]}</button>`).join('');scrollTo(0,sc)}

/* ---------- modal forms ---------- */
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.style.display='block'}
function closeM(){$('#modal').style.display='none';$('#modal').innerHTML=''}
let pendImg;
function itemForm(i){i=i||{};pendImg=undefined;
 modal(`<h2>${i.id?'EDITAR OBJETO':'NOVO OBJETO'}</h2><label>Nome</label><input id="f_n" value="${esc(i.name)}"><label>Descrição</label><input id="f_d" value="${esc(i.desc)}">
 <div class="grp"><div><label>Categoria</label>${sel('f_c','—',S.cats.map(c=>[c.id,c.name]),i.cat).replace('<select','<select style="width:100%"')}</div><div><label>Subcategoria</label><input id="f_s" value="${esc(i.sub)}"></div>
 <div><label>Peso (g, por unidade)</label><input id="f_g" type="number" min="0" inputmode="decimal" value="${i.g??''}"></div><div><label>Quantidade</label><input id="f_q" type="number" min="1" value="${i.qty||1}"></div>
 <div><label>Largura (células)</label><input id="f_w" type="number" min="1" value="${i.w||1}"></div><div><label>Altura (células)</label><input id="f_h" type="number" min="1" value="${i.h||1}"></div></div>
 <label><input type="checkbox" id="f_st" style="width:auto;min-height:0" ${i.stack?'checked':''}> Empilhável (permite quantidade maior que 1)</label>
 <label><input type="checkbox" id="f_bx" style="width:auto;min-height:0" ${i.box?'checked':''} onchange="$('#f_bxd').style.display=this.checked?'grid':'none'"> É um recipiente (estojo, necessaire, bolsa interna)</label><div class="grp" id="f_bxd" style="display:${i.box?'grid':'none'}"><div><label>Largura interna (células)</label><input id="f_bw" type="number" min="1" value="${i.box?.w||4}"></div><div><label>Altura interna (células)</label><input id="f_bh" type="number" min="1" value="${i.box?.h||4}"></div></div>
 <label>Imagem (PNG, WebP ou JPG)</label><input type="file" id="f_i" accept="image/png,image/webp,image/jpeg">${i.img?`<label><input type="checkbox" id="f_ri" style="width:auto;min-height:0"> Remover imagem atual</label>`:''}
 <label>Observações</label><textarea id="f_o">${esc(i.notes)}</textarea><div class="row" style="margin-top:12px"><button class="b sp" data-a="mc">Cancelar</button><button class="b pr sp" data-a="saveItem" data-id="${i.id||''}">Salvar</button></div>`);
 $('#f_i').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,384/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*m);cv.height=Math.round(im.height*m);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pendImg=cv.toDataURL('image/webp',.85);toast('Imagem pronta.')};im.onerror=()=>toast('Imagem inválida.');im.src=r.result};r.readAsDataURL(f)}}
function saveItem(id){const n=$('#f_n').value.trim();if(!n)return toast('Informe o nome.');
 const w=Math.max(1,parseInt($('#f_w').value)||1),h=Math.max(1,parseInt($('#f_h').value)||1),stack=$('#f_st').checked;let qty=Math.max(1,parseInt($('#f_q').value)||1);if(!stack)qty=1;
 const d={name:n,desc:$('#f_d').value,cat:$('#f_c').value||S.cats[S.cats.length-1]?.id,sub:$('#f_s').value,g:+$('#f_g').value||0,qty,stack,notes:$('#f_o').value,box:$('#f_bx').checked?{w:Math.max(1,parseInt($('#f_bw').value)||1),h:Math.max(1,parseInt($('#f_bh').value)||1)}:null};
 if(id){const i=It(id);{const ks=kids(i);if(ks.length){if(!d.box)return toast('Retire os itens de dentro antes de desmarcar recipiente.');const bad=ks.find(k=>k.loc.x+k.w>d.box.w||k.loc.y+k.h>d.box.h);if(bad)return toast('"'+bad.name+'" ficaria fora do novo tamanho interno.')}}if(w!==i.w||h!==i.h){const m=why(i.loc.eq,i.loc.comp,i.loc.x,i.loc.y,w,h,id);if(m)return toast('Novo tamanho não cabe: '+m)}
  Object.assign(i,d,{w,h});if(pendImg){i.img=pendImg;i.rot=0}if($('#f_ri')?.checked)i.img=null}
 else{const i={id:uid(),...d,w,h,rot:0,img:pendImg||null,loc:null};
  {const cid=ui.target||ui.comp;const s=spot(ui.eq,cid,w,h);if(!s)return toast('Sem espaço livre nesta grade para '+w+'×'+h+'.');i.w=s.w;i.h=s.h;i.loc={eq:ui.eq,comp:cid,x:s.x,y:s.y}}
  S.items.push(i);ui.sel=i.id}
 save();closeM();render()}
function simpleForm(title,fields,okAction,id){modal(`<h2>${title}</h2>`+fields.map(f=>`<label>${f[1]}</label><input id="g_${f[0]}" value="${esc(f[2]??'')}" ${f[3]||''}>`).join('')+`<div class="row" style="margin-top:12px"><button class="b sp" data-a="mc">Cancelar</button><button class="b pr sp" data-a="${okAction}" data-id="${id||''}">Salvar</button></div>`)}
const g=k=>$('#g_'+k).value.trim();

/* ---------- actions ---------- */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t)return;if(t.tagName==='SELECT')return;const a=t.dataset.a,id=t.dataset.id;
 const it=ui.sel&&It(ui.sel);
 switch(a){
 case'nav':ui.tab=id;if(id==='inv')ui.eq=null;render();break;
 case'openEq':ui.eq=id;ui.comp=E(id).comps[0]?.id;ui.sel=null;render();break;
 case'back':ui.eq=null;ui.sel=null;render();break;
 case'tab':ui.comp=id;render();break;
 case'pick':case'cell':case'mc':case'desel':break;}
 if(a==='pick'&&!dbl(id)){ui.sel=ui.sel===id?null:id;render()}
 if(a==='desel'){ui.sel=null;render()}
 if(a==='mc')closeM();
 if(a==='openBox'){ui.comp='b:'+id;render()}
 if(a==='closeBox'){const bx=It(ui.comp.slice(2));ui.comp=bx?(isExtG(bx.loc.eq,bx.loc.comp)?'ext':bx.loc.comp):null;render()}
 if(a==='go'){const i=It(id);ui.tab='inv';ui.eq=i.loc.eq;ui.comp=isExtG(i.loc.eq,i.loc.comp)?'ext':i.loc.comp;ui.sel=id;ui.hl=id;render();setTimeout(()=>ui.hl=null,3500)}
 if(a==='cell'&&it){const x=+t.dataset.x,y=+t.dataset.y;if(put(it,ui.eq,t.dataset.c,x,y,it.w,it.h)){ui.sel=null;render()}}
 if(a==='rot'&&it){const w=it.h,h=it.w;{const m=why(it.loc.eq,it.loc.comp,it.loc.x,it.loc.y,w,h,it.id);if(m)return toast('Não dá para girar: '+m)}it.w=w;it.h=h;it.rot=((it.rot||0)+90)%360;save();render()}
 if(a==='qp'&&it){if(!it.stack)return toast('Este objeto não é empilhável. Edite para permitir.');it.qty++;save();render()}
 if(a==='qm'&&it){if(it.qty>1){it.qty--;save();render()}}
 if(a==='edit'&&it)itemForm(it);
 if(a==='newItem'){ui.target=id;itemForm()}
 if(a==='saveItem')saveItem(id);
 if(a==='dup'&&it){const s=spot(it.loc.eq,it.loc.comp,it.w,it.h);if(!s)return toast('Sem espaço para duplicar.');const c={...it,id:uid(),name:it.name+' (cópia)',w:s.w,h:s.h,box:it.box?{...it.box}:null,loc:{eq:it.loc.eq,comp:it.loc.comp,x:s.x,y:s.y}};S.items.push(c);ui.sel=c.id;save();render()}
 if(a==='del'&&it&&kids(it).length)return toast('Esvazie "'+it.name+'" antes de excluir.');
 if(a==='del'&&it&&confirm('Excluir "'+it.name+'"?')){S.items=S.items.filter(i=>i.id!==it.id);ui.sel=null;save();render()}
 if(a==='zoom'&&it)modal(`<img src="${it.img}" style="width:100%;max-height:70vh;object-fit:contain;background:#000"><button class="b" style="width:100%;margin-top:8px" data-a="mc">Fechar</button>`);
 /* config */
 if(a==='extOn'){const e=E(id);e.ext=true;e.extGrids=[{id:uid(),name:'Carga 1',w:6,h:6}];save();render()}
 if(a==='eqAdd')simpleForm('NOVO EQUIPAMENTO',[['n','Nome'],['c','Código'],['l','Capacidade (L, opcional)','','type=number']],'eqSave');
 if(a==='eqEdit'){const e=E(id);simpleForm('EDITAR EQUIPAMENTO',[['n','Nome',e.name],['c','Código',e.code],['l','Capacidade (L)',e.liters,'type=number']],'eqSave',id)}
 if(a==='eqSave'){if(!g('n'))return toast('Informe o nome.');if(id){const e=E(id);Object.assign(e,{name:g('n'),code:g('c'),liters:g('l')})}else S.eq.push({id:uid(),name:g('n'),code:g('c'),liters:g('l'),brand:'',ext:false,comps:[{id:uid(),name:'Principal',w:6,h:6}]});save();closeM();render()}
 if(a==='eqDel'){if(inEq(id).length)return toast('Mova ou exclua os objetos deste equipamento antes de removê-lo.');if(confirm('Excluir equipamento?')){S.eq=S.eq.filter(e=>e.id!==id);save();render()}}
 if(a==='cpAdd')simpleForm('NOVO COMPARTIMENTO',[['n','Nome'],['w','Largura (células)',6,'type=number'],['h','Altura (células)',6,'type=number']],'cpSave',id.includes('|')?id:id+'|');
 if(a==='cpEdit'){const[e,k]=id.split('|'),c=comp(e,k);simpleForm('GRADE',[['n','Nome',c.name],['w','Largura (células)',c.w,'type=number'],['h','Altura (células)',c.h,'type=number']],'cpSave',id)}
 if(a==='cpSave'){const[e,k]=id.split('|'),w=Math.max(1,parseInt(g('w'))||1),h=Math.max(1,parseInt(g('h'))||1);if(!g('n'))return toast('Informe o nome.');
  if(k==='@ext')E(e).extGrids.push({id:uid(),name:g('n'),w,h});else if(k){const bad=inComp(e,k).find(i=>i.loc.x+i.w>w||i.loc.y+i.h>h);if(bad)return toast('"'+bad.name+'" ficaria fora da grade. Mova-o antes.');Object.assign(comp(e,k),{name:g('n'),w,h})}else E(e).comps.push({id:uid(),name:g('n'),w,h});save();closeM();render()}
 if(a==='cpDel'){const[e,k]=id.split('|');if(inComp(e,k).length)return toast('Esvazie o compartimento antes de excluir.');if(confirm('Excluir compartimento?')){E(e).comps=E(e).comps.filter(c=>c.id!==k);if(E(e).extGrids)E(e).extGrids=E(e).extGrids.filter(c=>c.id!==k);save();render()}}
 if(a==='catAdd')simpleForm('NOVA CATEGORIA',[['n','Nome'],['c','Cor','#78a342','type=color'],['d','Descrição']],'catSave');
 if(a==='catEdit'){const c=Ct(id);simpleForm('EDITAR CATEGORIA',[['n','Nome',c.name],['c','Cor',c.color,'type=color'],['d','Descrição',c.desc]],'catSave',id)}
 if(a==='catSave'){if(!g('n'))return toast('Informe o nome.');if(id)Object.assign(Ct(id),{name:g('n'),color:g('c'),desc:g('d')});else S.cats.push({id:uid(),name:g('n'),color:g('c'),icon:g('n')[0],desc:g('d'),subs:[]});save();closeM();render()}
 if(a==='catDel'){if(S.items.some(i=>i.cat===id))return toast('Há objetos nesta categoria. Altere a categoria deles antes.');S.cats=S.cats.filter(c=>c.id!==id);save();render()}
 if(a==='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='field-inventory-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
 if(a==='imp'){const f=$('#impf');f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.eq)||!Array.isArray(d.items)||!Array.isArray(d.cats))throw 0;if(confirm('Substituir TODOS os dados atuais pelo backup?')){S=d;migrate();ui.eq=null;ui.sel=null;save();render();toast('Backup importado.')}}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f.files[0])};f.click()}
});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset.a==='mvsel'&&t.value&&ui.sel){const[e,k]=t.value.split('|'),it=It(ui.sel);if(autoMove(it,e,k)){ui.eq=e;ui.comp=isExtG(e,k)?'ext':k;render()}else t.value=''}
 if(t.id==='fc'){ui.fc=t.value;render()}if(t.id==='fe'){ui.fe=t.value;render()}if(t.id==='so'){ui.sort=t.value;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){ui.q=ev.target.value;$('#res').innerHTML=resHtml()}});

/* ---------- drag (touch + mouse) ---------- */
let dr=null,lastTap={id:null,t:0};
function dbl(id){const n=Date.now(),b=It(id)?.box&&lastTap.id===id&&n-lastTap.t<400;lastTap=b?{id:null,t:0}:{id,t:n};if(b){ui.sel=id;ui.comp='b:'+id;render()}return b}
document.addEventListener('pointerdown',ev=>{const el=ev.target.closest('.it');if(!el||ev.button>0)return;const r=el.getBoundingClientRect();dr={id:el.dataset.id,x:ev.clientX,y:ev.clientY,ox:ev.clientX-r.left,oy:ev.clientY-r.top,on:false,pid:ev.pointerId}});
function dropPos(ev){const gr=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.grid');if(!gr)return null;const r=gr.getBoundingClientRect(),s=+gr.dataset.s;return{gr,s,x:Math.round((ev.clientX-dr.ox-r.left)/s),y:Math.round((ev.clientY-dr.oy-r.top)/s)}}
document.addEventListener('pointermove',ev=>{if(!dr)return;const it=It(dr.id);if(!dr.on){if(Math.hypot(ev.clientX-dr.x,ev.clientY-dr.y)<8)return;dr.on=true;document.body.classList.add('dragging');const gh=$('#ghost'),c=comp(it.loc.eq,it.loc.comp),s=cs(c);gh.style.cssText=`display:block;width:${it.w*s}px;height:${it.h*s}px`}
 ev.preventDefault();const gh=$('#ghost');gh.style.left=ev.clientX-dr.ox+'px';gh.style.top=ev.clientY-dr.oy+'px';
 document.querySelectorAll('.prev').forEach(p=>p.remove());const p=dropPos(ev);if(p){const ok=!why(ui.eq,p.gr.dataset.c,p.x,p.y,it.w,it.h,it.id),d=document.createElement('div');d.className='prev';d.style.cssText=`left:${p.x*p.s}px;top:${p.y*p.s}px;width:${it.w*p.s}px;height:${it.h*p.s}px;border-color:${ok?'#78a342':'#c9482f'};background:${ok?'#78a34255':'#c9482f55'}`;p.gr.appendChild(d)}},{passive:false});
document.addEventListener('pointerup',ev=>{if(!dr)return;const d=dr;dr=null;document.body.classList.remove('dragging');$('#ghost').style.display='none';document.querySelectorAll('.prev').forEach(p=>p.remove());
 if(!d.on){if(dbl(d.id))return;ui.sel=ui.sel===d.id?null:d.id;render();return}
 dr=d;const p=dropPos(ev);dr=null;const it=It(d.id);if(p&&put(it,ui.eq,p.gr.dataset.c,p.x,p.y,it.w,it.h))ui.sel=d.id;render()});
document.addEventListener('pointercancel',()=>{dr=null;document.body.classList.remove('dragging');$('#ghost').style.display='none'});
migrate();save();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
